@if(product){
<mat-card appearance="raised" class="product-card" routerLink="/shop/{{product.id}}">
      <img mat-card-image src="{{product.pictureUrl}}" class="rounded-t-lg" alt="Product image">
      <mat-card-content class="mt-2">
        <h2 class="text-sm font-semibold uppercase">{{product.name}}</h2>
        <p class="font-light">{{product.price | currency}}</p>
      </mat-card-content>
      <mat-card-actions (click)="$event.stopPropagation()">
        <!-- 
         
         (click)="cartService.addItemToCart(product)"
        -->
        <button mat-stroked-button class="w-full shadow">
          <mat-icon>add_shopping_cart</mat-icon>
          Add to cart
        </button>
      </mat-card-actions>
    </mat-card>
}
