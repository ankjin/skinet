<header class="border-b shadow-md p-3 w-full">
    <div class="flex align-middle items-center justify-between max-w-screen-2xl mx-auto">
        <img routerLink="/" src="/images/logo.png" alt="app logo" class="max-h-16">
        <nav class="flex gap-3 my-2 uppercase text-2xl">
            <a routerLink="/" 
                routerLinkActive="active"
            >Home</a>
            <a routerLink="/shop" routerLinkActive="active">Shop</a>
            <a routerLink="/test-error" routerLinkActive="active">Errors</a>
            <a *appIsAdmin routerLink="/admin" routerLinkActive="active">Admin</a>
        </nav>
        <div class="flex gap-3 align-middle">
            <a routerLink="/cart" routerLinkActive="active" 
                matBadge="5" 
                matBadgeSize="large" 
                class="custom-badge mt-2 mr-2">
                <mat-icon>shopping_cart</mat-icon>
            </a>
            <button class="rounded-md!" routerLink="/account/login" mat-stroked-button>Login</button>
            <button class="rounded-md!" routerLink="/account/register" mat-stroked-button>Register</button>
        </div>
    </div>
</header>
